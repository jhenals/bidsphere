spring:

  application:
    name: bidsphere-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/bidsphere
    username: bidsphere
    password: bidsphere

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8081

logging:
  level:
    com.bidsphere: INFO